services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
